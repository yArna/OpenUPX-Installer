[package]
name = "openuxp-installer"
version = "0.1.0"
description = "A focused installer for Adobe UXP .ccx packages"
authors = ["OpenUXP Contributors"]
edition = "2021"

[lib]
name = "openuxp_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
